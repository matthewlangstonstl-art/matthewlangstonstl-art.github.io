<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MLB Master Scout Report</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;600;700&display=swap');

:root {
  --green-dark:   #1a3d16;
  --green-field:  #2d5a27;
  --green-light:  #3e7a36;
  --dirt:         #c5a076;
  --dirt-dark:    #9e7a52;
  --cream:        #f5f0e8;
  --white:        #ffffff;
  --black:        #0d0d0d;
  --red:          #c41e3a;
  --red-dark:     #8b1428;
  --blue:         #005A9C;
  --blue-dark:    #003d6b;
  --gold:         #e8b84b;
  --gold-dark:    #b8882b;
  --gray:         #888;
  --gray-light:   #f0f0f0;
  --warn:         #ff6b35;
  --ok:           #4caf50;
  --fatigue-0:    #4caf50;
  --fatigue-1:    #8bc34a;
  --fatigue-2:    #ffc107;
  --fatigue-3:    #ff9800;
  --fatigue-4:    #f44336;
  --predict-bg:   #0d1f3c;
  --predict-hi:   #e8b84b;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'DM Sans', sans-serif;
  background: #0d0d0d;
  background-image: radial-gradient(ellipse at 30% 10%, #1a3d16 0%, transparent 50%),
                    radial-gradient(ellipse at 70% 90%, #003d6b 0%, transparent 50%);
  min-height: 100vh;
  color: var(--cream);
}

.page-wrapper { max-width: 1400px; margin: 0 auto; padding: 20px; }

/* ── HEADER ── */
.header {
  background: linear-gradient(135deg, var(--green-dark) 0%, #0d1f0a 100%);
  border: 2px solid var(--green-light);
  border-radius: 16px;
  padding: 28px 40px;
  text-align: center;
  margin-bottom: 24px;
  position: relative;
  overflow: hidden;
}
.header::before {
  content: '⚾';
  position: absolute;
  font-size: 200px;
  opacity: 0.04;
  top: -40px; right: -30px;
  line-height: 1;
}
.header h1 {
  font-family: 'Bebas Neue', sans-serif;
  font-size: clamp(2.4rem, 5vw, 4rem);
  letter-spacing: 6px;
  color: var(--cream);
  line-height: 1;
}
.header h1 span { color: var(--gold); }
.header p { color: #aaa; font-size: 0.9rem; margin-top: 6px; letter-spacing: 2px; text-transform: uppercase; }

/* ── CONTROLS ── */
.controls {
  background: #111;
  border: 1px solid #2a2a2a;
  border-radius: 12px;
  padding: 20px 28px;
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 14px;
  align-items: center;
  margin-bottom: 28px;
}
.controls label { color: #888; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; display: block; margin-bottom: 4px; }
.ctrl-group { display: flex; flex-direction: column; }
.controls input[type="date"],
.controls input[type="text"] {
  padding: 11px 16px;
  font-size: 15px;
  font-family: 'DM Mono', monospace;
  background: #1a1a1a;
  border: 1px solid #333;
  border-radius: 8px;
  color: var(--cream);
  outline: none;
  transition: border-color 0.2s;
  min-width: 180px;
}
.controls input:focus { border-color: var(--gold); }
.run-btn {
  background: linear-gradient(135deg, var(--red) 0%, var(--red-dark) 100%);
  color: white;
  border: none;
  padding: 13px 32px;
  font-size: 15px;
  font-family: 'Bebas Neue', sans-serif;
  letter-spacing: 3px;
  border-radius: 8px;
  cursor: pointer;
  transition: all 0.2s;
  align-self: flex-end;
  min-width: 200px;
}
.run-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(196,30,58,0.4); }
.run-btn:disabled { background: #333; color: #666; transform: none; box-shadow: none; cursor: not-allowed; }

/* ── LOADING ── */
#loading {
  display: none;
  text-align: center;
  padding: 40px;
  font-family: 'DM Mono', monospace;
  color: var(--gold);
  font-size: 1rem;
}
.loading-bar {
  width: 300px; height: 4px;
  background: #222; border-radius: 2px;
  margin: 12px auto;
  overflow: hidden;
}
.loading-bar-inner {
  height: 100%;
  background: linear-gradient(90deg, var(--gold), var(--green-light), var(--gold));
  background-size: 200% 100%;
  animation: loading-slide 1.5s linear infinite;
  width: 60%;
}
@keyframes loading-slide { 0%{background-position:200% 0} 100%{background-position:-200% 0} }

/* ── SECTION TITLES ── */
.section-title {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1.5rem;
  letter-spacing: 4px;
  padding: 12px 24px;
  border-radius: 10px 10px 0 0;
  display: flex;
  align-items: center;
  gap: 10px;
  margin-top: 36px;
}
.section-title.green  { background: linear-gradient(90deg, var(--green-dark), #0d1f0a); border: 1px solid var(--green-light); border-bottom: none; color: var(--cream); }
.section-title.dark   { background: linear-gradient(90deg, #0d0d0d, #1a1a1a); border: 1px solid #333; border-bottom: none; color: #eee; }
.section-title.blue   { background: linear-gradient(90deg, var(--blue-dark), #001a33); border: 1px solid var(--blue); border-bottom: none; color: #eee; }
.section-title.gold   { background: linear-gradient(90deg, #2a1f00, #1a1300); border: 1px solid var(--gold-dark); border-bottom: none; color: var(--gold); }
.section-title.red    { background: linear-gradient(90deg, var(--red-dark), #3d0010); border: 1px solid var(--red); border-bottom: none; color: #eee; }
.section-icon { font-size: 1.2rem; }

/* ── TABLES ── */
.table-wrap { border-radius: 0 0 10px 10px; overflow: hidden; border: 1px solid #2a2a2a; border-top: none; }
table { width: 100%; border-collapse: collapse; background: #111; font-size: 13.5px; }
th {
  background: #1a1a1a;
  color: #aaa;
  font-family: 'DM Mono', monospace;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 1px;
  padding: 10px 12px;
  border-bottom: 1px solid #2a2a2a;
  font-weight: 500;
}
td {
  padding: 9px 12px;
  border-bottom: 1px solid #1a1a1a;
  vertical-align: top;
  color: #ccc;
}
tr:last-child td { border-bottom: none; }
tr:hover td { background: rgba(255,255,255,0.02); }
.away-col { background: rgba(196,30,58,0.04); }
.home-col  { background: rgba(0,90,156,0.04); }
.out-of-pos { color: var(--warn) !important; font-weight: 700; }
.player-name { font-weight: 600; color: var(--cream); }
.pos-badge {
  display: inline-block;
  background: #222;
  border: 1px solid #444;
  border-radius: 4px;
  padding: 1px 6px;
  font-family: 'DM Mono', monospace;
  font-size: 11px;
  font-weight: 700;
  color: var(--gold);
}
.backup-pos { font-family: 'DM Mono', monospace; font-size: 11px; color: #777; }
.order-num { font-family: 'Bebas Neue', sans-serif; font-size: 1.2rem; color: #555; }
.game-sub-header td {
  background: #1a1a1a !important;
  color: #888;
  font-size: 11px;
  font-family: 'DM Mono', monospace;
  letter-spacing: 1px;
  border-top: 2px solid #333;
  border-bottom: 1px solid #333;
}

/* ── DIAGRAMS ── */
.diagram-container {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 28px;
  margin-top: 28px;
  margin-bottom: 4px;
}
.diagram-card {
  background: linear-gradient(145deg, #0a1f0a, #0d0d0d);
  border-radius: 14px;
  padding: 22px;
  box-shadow: 0 12px 40px rgba(0,0,0,0.5);
  width: 620px;
  border: 2px solid var(--green-dark);
}
.diagram-header {
  text-align: center;
  margin-bottom: 14px;
  padding-bottom: 12px;
  border-bottom: 1px solid #2a2a2a;
}
.diagram-team {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 28px;
  letter-spacing: 4px;
  color: var(--cream);
}
.diagram-date { color: #777; font-size: 12px; font-family: 'DM Mono', monospace; margin-top: 2px; }

.grass { fill: var(--green-field); }
.dirt  { fill: var(--dirt); }
.line  { stroke: rgba(255,255,255,0.3); stroke-width: 2; }
.base  { fill: #fff; }
.p-circle { fill: #cc0000; stroke: #fff; stroke-width: 2; }
.p-num    { fill: #fff; font-size: 13px; font-weight: bold; text-anchor: middle; dominant-baseline: middle; font-family: 'DM Mono', monospace; }
.p-label  { fill: rgba(255,255,255,0.6); font-size: 10px; font-weight: 800; text-anchor: middle; font-family: 'DM Mono', monospace; }
.p-name   { fill: #fff; font-size: 11px; font-weight: bold; text-anchor: middle; font-family: 'DM Sans', sans-serif; }
.p-back   { fill: #aaa; font-size: 10px; text-anchor: middle; font-family: 'DM Mono', monospace; }

/* ── PREDICTION PANEL ── */
.predict-container {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 24px;
  margin-top: 0;
}
@media(max-width: 900px) { .predict-container { grid-template-columns: 1fr; } }

.predict-team-block {
  background: linear-gradient(145deg, var(--predict-bg), #060d1a);
  border: 1px solid #1e3a5f;
  border-radius: 0 0 12px 12px;
  overflow: hidden;
}
.predict-team-header {
  background: #0d1f3c;
  padding: 14px 20px;
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1.3rem;
  letter-spacing: 3px;
  color: var(--gold);
  border-bottom: 1px solid #1e3a5f;
  display: flex;
  align-items: center;
  gap: 10px;
}
.predict-section {
  padding: 16px 20px;
  border-bottom: 1px solid #1a2d45;
}
.predict-section:last-child { border-bottom: none; }
.predict-label {
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 2px;
  color: var(--gold);
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.predict-row {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 8px 0;
  border-bottom: 1px solid #0d1f3c;
}
.predict-row:last-child { border-bottom: none; }
.predict-player {
  font-weight: 700;
  color: var(--cream);
  font-size: 13px;
  min-width: 130px;
}
.predict-detail {
  color: #7a9bbf;
  font-size: 12px;
  font-family: 'DM Mono', monospace;
  line-height: 1.5;
  flex: 1;
}
.predict-pct {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1.3rem;
  color: var(--gold);
  min-width: 48px;
  text-align: right;
}
.predict-empty { color: #555; font-size: 12px; font-style: italic; padding: 8px 0; }

/* ── CONF BAR ── */
.conf-bar {
  height: 3px;
  background: #1a2d45;
  border-radius: 2px;
  margin-top: 4px;
  overflow: hidden;
}
.conf-bar-fill {
  height: 100%;
  border-radius: 2px;
  background: linear-gradient(90deg, var(--blue), var(--gold));
  transition: width 0.5s ease;
}

/* ── BULLPEN FATIGUE ── */
.bullpen-container {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 24px;
}
@media(max-width: 900px) { .bullpen-container { grid-template-columns: 1fr; } }

.bullpen-block {
  background: #111;
  border: 1px solid #2a2a2a;
  border-radius: 0 0 12px 12px;
}
.bullpen-team-header {
  background: #1a1a1a;
  padding: 12px 20px;
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1.2rem;
  letter-spacing: 3px;
  color: #eee;
  border-bottom: 1px solid #2a2a2a;
}
.bullpen-row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 20px;
  border-bottom: 1px solid #1a1a1a;
}
.bullpen-row:last-child { border-bottom: none; }
.bp-num {
  font-family: 'DM Mono', monospace;
  font-size: 12px;
  color: #666;
  width: 28px;
  text-align: center;
}
.bp-name {
  font-weight: 600;
  color: var(--cream);
  flex: 1;
  font-size: 13px;
}
.bp-role {
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  color: #888;
  min-width: 55px;
}
.bp-recent {
  font-family: 'DM Mono', monospace;
  font-size: 11px;
  color: #7a9bbf;
  min-width: 90px;
  text-align: right;
}
.fatigue-dot {
  width: 38px; height: 38px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-family: 'Bebas Neue', sans-serif;
  font-size: 0.85rem;
  letter-spacing: 1px;
  color: #fff;
  flex-shrink: 0;
}
.fat-0 { background: #1a4a1a; color: var(--fatigue-0); border: 2px solid var(--fatigue-0); }
.fat-1 { background: #2a3a10; color: var(--fatigue-1); border: 2px solid var(--fatigue-1); }
.fat-2 { background: #3a2a00; color: var(--fatigue-2); border: 2px solid var(--fatigue-2); }
.fat-3 { background: #3a1e00; color: var(--fatigue-3); border: 2px solid var(--fatigue-3); }
.fat-4 { background: #3a0a0a; color: var(--fatigue-4); border: 2px solid var(--fatigue-4); }

/* ── DEF SPECIALIST FLAGS ── */
.flag-badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 4px;
  font-size: 10px;
  font-family: 'DM Mono', monospace;
  font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
}
.flag-def  { background: rgba(0,90,156,0.3); color: #4da6ff; border: 1px solid #005A9C; }
.flag-pr   { background: rgba(76,175,80,0.2); color: #81c784; border: 1px solid #4caf50; }
.flag-ph   { background: rgba(232,184,75,0.2); color: var(--gold); border: 1px solid var(--gold-dark); }
.flag-lefty{ background: rgba(156,39,176,0.2); color: #ce93d8; border: 1px solid #9c27b0; }
.flag-righty{background: rgba(255,87,34,0.2); color: #ffab91; border: 1px solid #ff5722; }
.flag-warn { background: rgba(255,107,53,0.2); color: var(--warn); border: 1px solid var(--warn); }

/* ── HISTORY TABLES ── */
.history-game-row td { background: #1a1a1a !important; color: #888; font-size: 12px; font-family: 'DM Mono', monospace; border-top: 2px solid #333; }
.path-arrow { color: var(--gold); font-family: 'DM Mono', monospace; }

/* ── PLATOON GRID ── */
.platoon-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  gap: 10px;
  padding: 16px 20px;
}
.platoon-card {
  background: #1a2d45;
  border: 1px solid #1e3a5f;
  border-radius: 8px;
  padding: 12px;
  text-align: center;
}
.platoon-name { font-weight: 700; color: var(--cream); font-size: 12px; margin-bottom: 4px; }
.platoon-hand { display: flex; justify-content: center; gap: 6px; margin-bottom: 6px; }
.platoon-bar-wrap { height: 4px; background: #0d1f3c; border-radius: 2px; overflow: hidden; margin-bottom: 4px; }
.platoon-bar-fill { height: 100%; border-radius: 2px; }
.platoon-vs-l { background: linear-gradient(90deg, #9c27b0, #ce93d8); }
.platoon-vs-r { background: linear-gradient(90deg, #ff5722, #ffab91); }
.platoon-stat { font-family: 'DM Mono', monospace; font-size: 10px; color: #888; }

/* ── SCOREBOARD-STYLE MATCHUP HEADER ── */
.matchup-header {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 24px;
  background: #111;
  border: 1px solid #2a2a2a;
  border-radius: 12px;
  padding: 20px 32px;
  margin-bottom: 28px;
  flex-wrap: wrap;
}
.matchup-team { text-align: center; }
.matchup-team-name {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 2rem;
  letter-spacing: 4px;
  line-height: 1;
}
.matchup-team-label { font-size: 11px; color: #666; letter-spacing: 2px; text-transform: uppercase; font-family: 'DM Mono', monospace; margin-top: 2px; }
.matchup-vs {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 2.5rem;
  color: #444;
  letter-spacing: 4px;
}
.matchup-date {
  text-align: center;
  font-family: 'DM Mono', monospace;
  font-size: 12px;
  color: #666;
}
.away-name { color: var(--red); }
.home-name { color: #4da6ff; }
</style>
</head>
<body>
<div class="page-wrapper">

  <div class="header">
    <h1>⚾ MLB <span>Master</span> Scout</h1>
    <p>Prediction Model · Fatigue Ratings · Substitution Intelligence · Official Scorer Edition</p>
  </div>

  <div class="controls">
    <div class="ctrl-group">
      <label>Game Date</label>
      <input type="date" id="dateInput">
    </div>
    <div class="ctrl-group">
      <label>Team Name</label>
      <input type="text" id="teamInput" placeholder="e.g. Cardinals, Cubs, Red Sox">
    </div>
    <button class="run-btn" id="runBtn" onclick="runMasterScout()">▶ RUN SCOUT REPORT</button>
  </div>

  <div id="loading">
    <div id="loadingMsg">⚾ Scouting in progress...</div>
    <div class="loading-bar"><div class="loading-bar-inner"></div></div>
  </div>
  <div id="reportContainer"></div>

</div>

<script>
// ═══════════════════════════════════════════════════════
// 1. CORE UTILITIES
// ═══════════════════════════════════════════════════════

function setLoading(msg) {
  document.getElementById('loadingMsg').textContent = msg;
}

async function fetchJSON(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error("API Error: " + url);
  return r.json();
}

function abbreviateSub(desc) {
  if (!desc) return "";
  return desc
    .replace(/Defensive Substitution:/gi, "DEF SUB:")
    .replace(/Offensive Substitution:/gi, "OFF SUB:")
    .replace(/Defensive switch from/gi, "DEF SWITCH")
    .replace(/Pinch-hitter/gi, "PH")
    .replace(/Pinch-runner/gi, "PR")
    .replace(/remains in the game as the/gi, "→")
    .replace(/center field/gi, "CF").replace(/left field/gi, "LF")
    .replace(/right field/gi, "RF").replace(/first base/gi, "1B")
    .replace(/second base/gi, "2B").replace(/third base/gi, "3B")
    .replace(/shortstop/gi, "SS").replace(/catcher/gi, "C")
    .replace(/designated hitter/gi, "DH").replace(/pitcher/gi, "P")
    .replace(/batting (\d)\w+, playing/gi, "bat#$1")
    .trim();
}

async function getTeamId(input) {
  const data = await fetchJSON("https://statsapi.mlb.com/api/v1/teams?sportId=1");
  const search = input.toLowerCase().trim();
  for (let t of data.teams) {
    if (t.abbreviation.toLowerCase() === search ||
        t.teamName.toLowerCase() === search ||
        t.name.toLowerCase().includes(search)) return t.id;
  }
  return null;
}

async function getPlayerVersatility(playerId, activePos) {
  try {
    const data = await fetchJSON(`https://statsapi.mlb.com/api/v1/people/${playerId}?hydrate=stats(group=[fielding],type=[career])`);
    const stats = data.people[0]?.stats;
    if (!stats?.length) return "";
    let positions = [];
    for (let split of stats[0].splits) {
      let pos = split.position.abbreviation;
      if (!["P","DH","PH","PR","TWP","O",activePos].includes(pos) && !positions.includes(pos))
        positions.push(pos);
    }
    return positions.sort().join(", ");
  } catch(e) { return ""; }
}

async function formatPlayerData(p, isStarter) {
  let gamePos = p.position.abbreviation;
  if (isStarter && p.allPositions?.length) gamePos = p.allPositions[0].abbreviation;
  const primPos = p.person?.primaryPosition?.abbreviation || gamePos;
  const isOutOfPos = isStarter && gamePos !== primPos && primPos !== "TWP" && gamePos !== "DH";
  return {
    num: p.jerseyNumber || "-",
    id: p.person.id,
    name: p.person.fullName,
    pos: gamePos,
    prim: primPos,
    backups: await getPlayerVersatility(p.person.id, gamePos),
    isOutOfPos,
    bats: p.person.batSide?.code || "?",
    throws: p.person.pitchHand?.code || "?"
  };
}

async function getPlayerInSlot(players, slot) {
  for (let id in players) {
    if (players[id].battingOrder == slot)
      return await formatPlayerData(players[id], true);
  }
  return {num:"", id:0, name:"TBD", pos:"", backups:"", isOutOfPos:false, prim:"", bats:"?", throws:"?"};
}

async function getBench(players) {
  let promises = [];
  for (let id in players) {
    let p = players[id];
    let order = parseInt(p.battingOrder);
    if (p.position.abbreviation !== "P" && (!order || order % 100 !== 0))
      promises.push(formatPlayerData(p, false));
  }
  return Promise.all(promises);
}

// ═══════════════════════════════════════════════════════
// 2. GAME LIST HELPERS
// ═══════════════════════════════════════════════════════

async function getPastGameList(endDateStr, teamName, lookbackDays = 60) {
  try {
    let end = new Date(endDateStr + "T12:00:00");
    let start = new Date(end); start.setDate(start.getDate() - lookbackDays);
    let startStr = start.toISOString().split('T')[0];
    let endStr   = end.toISOString().split('T')[0];
    const schedule = await fetchJSON(`https://statsapi.mlb.com/api/v1/schedule?sportId=1&startDate=${startStr}&endDate=${endStr}`);
    let games = [];
    if (schedule.dates) {
      for (let d of schedule.dates) {
        for (let g of d.games) {
          const away = g.teams.away.team.name.toLowerCase();
          const home = g.teams.home.team.name.toLowerCase();
          const srch = teamName.toLowerCase();
          if ((away.includes(srch) || home.includes(srch)) && g.status.abstractGameState === "Final") {
            games.push({
              pk: g.gamePk, date: d.date,
              summary: g.teams.away.team.name + " @ " + g.teams.home.team.name,
              awayName: g.teams.away.team.name, homeName: g.teams.home.team.name
            });
          }
        }
      }
    }
    return games.sort((a,b) => new Date(b.date)-new Date(a.date));
  } catch(e) { return []; }
}

// ═══════════════════════════════════════════════════════
// 3. HISTORY: SUB PATTERNS
// ═══════════════════════════════════════════════════════

async function getHistoryData(endDateStr, teamName) {
  let history = [], games = await getPastGameList(endDateStr, teamName, 45);
  let recent = games.slice(0, 4);
  for (let game of recent) {
    let [live, box] = await Promise.all([
      fetchJSON(`https://statsapi.mlb.com/api/v1/game/${game.pk}/playByPlay`),
      fetchJSON(`https://statsapi.mlb.com/api/v1/game/${game.pk}/boxscore`)
    ]);
    let side = (game.awayName.toLowerCase().includes(teamName.toLowerCase())) ? "away" : "home";
    let players = box.teams[side].players;
    let gameSubs = [];
    let allSubLines = [];
    if (live.allPlays) {
      live.allPlays.forEach(play => {
        let inning = (play.about.halfInning === "bottom" ? "B" : "T") + play.about.inning;
        if (play.playEvents) {
          play.playEvents.forEach(ev => {
            if (ev.details?.description) allSubLines.push({inning, desc: ev.details.description});
          });
        }
      });
    }
    for (let id in players) {
      let p = players[id];
      if (p.position.abbreviation === "P") continue;
      let order = parseInt(p.battingOrder);
      let isStarter = (order && order % 100 === 0);
      let allPos = (p.allPositions || []).map(pos => pos.abbreviation);
      let lastName = p.person.fullName.split(" ").pop();
      let entryDetail = "";
      for (let l of allSubLines) {
        if (l.desc.includes(lastName) && (l.desc.includes("Substitution")||l.desc.includes("pinch")||l.desc.includes("to "))) {
          entryDetail = l.inning + ": " + abbreviateSub(l.desc.split(".")[0]);
          break;
        }
      }
      if (!isStarter) {
        if ((p.stats.batting?.plateAppearances > 0)||(parseFloat(p.stats.fielding?.inningsPlayed||0) > 0)) {
          gameSubs.push([p.jerseyNumber||"-", p.person.fullName, allPos.join("→"), entryDetail||"ENT"]);
        }
      } else if (allPos.length > 1) {
        gameSubs.push([p.jerseyNumber||"-", p.person.fullName, allPos.join("→"), entryDetail||"SHIFT"]);
      }
    }
    history.push({date: game.date, summary: game.summary, subs: gameSubs});
  }
  return history;
}

// ═══════════════════════════════════════════════════════
// 4. PREDICTION MODEL — EXTENDED HISTORY ANALYSIS
// ═══════════════════════════════════════════════════════

async function buildPredictionModel(endDateStr, teamName) {
  let games = await getPastGameList(endDateStr, teamName, 60);
  let allGames = games.slice(0, 20); // up to 20 games

  // Counters per player
  let phCount = {}, prCount = {}, defCount = {}, platoonPH = {}, totalGames = allGames.length;
  let playerHandedness = {}; // pid -> bats

  for (let game of allGames) {
    try {
      let [live, box] = await Promise.all([
        fetchJSON(`https://statsapi.mlb.com/api/v1/game/${game.pk}/playByPlay`),
        fetchJSON(`https://statsapi.mlb.com/api/v1/game/${game.pk}/boxscore`)
      ]);
      let side = (game.awayName.toLowerCase().includes(teamName.toLowerCase())) ? "away" : "home";
      let players = box.teams[side].players;

      // Starters batting orders
      let starterIds = new Set();
      for (let id in players) {
        let p = players[id];
        let order = parseInt(p.battingOrder);
        if (order && order % 100 === 0) starterIds.add(p.person.id);
        playerHandedness[p.person.id] = p.person.batSide?.code || "?";
      }

      // Walk through plays to capture PH/PR/DEF
      if (live.allPlays) {
        for (let play of live.allPlays) {
          let inning = play.about.inning;
          if (play.playEvents) {
            for (let ev of play.playEvents) {
              let desc = ev.details?.description || "";
              if (!desc) continue;
              // Find which player this references
              for (let id in players) {
                let p = players[id];
                let pid = p.person.id;
                let lastName = p.person.fullName.split(" ").pop();
                if (!desc.includes(lastName)) continue;
                let order = parseInt(p.battingOrder);
                let isStarter = (order && order % 100 === 0);
                if (isStarter) continue;

                if (/pinch.hit/i.test(desc)||/Offensive Substitution.*batting/i.test(desc)) {
                  phCount[pid] = (phCount[pid]||0)+1;
                  // detect platoon context from pitcher hand in lineup data
                  let pitchers = box.teams[side==="away"?"home":"away"].pitchers||[];
                  let sp = pitchers[0];
                  let spData = sp ? box.teams[side==="away"?"home":"away"].players["ID"+sp] : null;
                  let pitcherHand = spData?.person?.pitchHand?.code || "?";
                  let batsHand = playerHandedness[pid] || "?";
                  let matchup = batsHand + "vP" + pitcherHand; // e.g. LvPR = lefty batter vs right pitcher
                  if (!platoonPH[pid]) platoonPH[pid] = {};
                  platoonPH[pid][matchup] = (platoonPH[pid][matchup]||0)+1;
                  // track late (inning >= 6)
                  if (!platoonPH[pid].lateInning) platoonPH[pid].lateInning = 0;
                  if (inning >= 6) platoonPH[pid].lateInning++;

                } else if (/pinch.run/i.test(desc)||/Offensive Substitution.*running/i.test(desc)) {
                  prCount[pid] = (prCount[pid]||0)+1;
                } else if (/Defensive Substitution/i.test(desc)||/Defensive switch/i.test(desc)) {
                  defCount[pid] = (defCount[pid]||0)+1;
                }
              }
            }
          }
        }
      }
    } catch(e) { /* skip bad game */ }
  }

  // Build player name lookup from last game box
  let playerNames = {};
  let jerseys = {};
  try {
    let lastGame = allGames[0];
    if (lastGame) {
      let box = await fetchJSON(`https://statsapi.mlb.com/api/v1/game/${lastGame.pk}/boxscore`);
      let side = (lastGame.awayName.toLowerCase().includes(teamName.toLowerCase())) ? "away" : "home";
      for (let id in box.teams[side].players) {
        let p = box.teams[side].players[id];
        playerNames[p.person.id] = p.person.fullName;
        jerseys[p.person.id] = p.jerseyNumber||"-";
      }
    }
  } catch(e) {}

  // Sort and build prediction arrays
  let phList = Object.entries(phCount)
    .sort((a,b)=>b[1]-a[1])
    .slice(0,8)
    .map(([pid, count]) => ({
      pid: +pid, name: playerNames[pid]||"ID:"+pid, num: jerseys[pid]||"-",
      count, pct: Math.round(count/totalGames*100),
      platoon: platoonPH[pid]||{},
      bats: playerHandedness[pid]||"?"
    }));

  let prList = Object.entries(prCount)
    .sort((a,b)=>b[1]-a[1])
    .slice(0,5)
    .map(([pid, count]) => ({
      pid: +pid, name: playerNames[pid]||"ID:"+pid, num: jerseys[pid]||"-",
      count, pct: Math.round(count/totalGames*100), bats: playerHandedness[pid]||"?"
    }));

  let defList = Object.entries(defCount)
    .sort((a,b)=>b[1]-a[1])
    .slice(0,5)
    .map(([pid, count]) => ({
      pid: +pid, name: playerNames[pid]||"ID:"+pid, num: jerseys[pid]||"-",
      count, pct: Math.round(count/totalGames*100), bats: playerHandedness[pid]||"?"
    }));

  return { phList, prList, defList, totalGames };
}

// ═══════════════════════════════════════════════════════
// 5. BULLPEN FATIGUE MODEL
// ═══════════════════════════════════════════════════════

async function buildBullpenFatigue(endDateStr, teamName) {
  let games = await getPastGameList(endDateStr, teamName, 10);
  let recent = games.slice(0, 5); // last 5 games for fatigue
  let relievers = {}; // pid -> {name, num, throws, appearances: [{date, pitches, ip, er}]}
  let gameIndex = 0;

  for (let game of recent) {
    try {
      let box = await fetchJSON(`https://statsapi.mlb.com/api/v1/game/${game.pk}/boxscore`);
      let side = (game.awayName.toLowerCase().includes(teamName.toLowerCase())) ? "away" : "home";
      let teamBox = box.teams[side];
      if (!teamBox.pitchers) continue;
      for (let i = 1; i < teamBox.pitchers.length; i++) { // skip starter (index 0)
        let p = teamBox.players["ID"+teamBox.pitchers[i]];
        if (!p) continue;
        let pid = p.person.id;
        let s = p.stats.pitching||{};
        if (!relievers[pid]) {
          relievers[pid] = {
            name: p.person.fullName, num: p.jerseyNumber||"-",
            throws: p.person.pitchHand?.code||"?",
            appearances: []
          };
        }
        relievers[pid].appearances.push({
          date: game.date, gameIndex,
          pitches: +(s.numberOfPitches||0),
          ip: parseFloat(s.inningsPitched||0),
          er: +(s.earnedRuns||0),
          k: +(s.strikeOuts||0)
        });
      }
    } catch(e) {}
    gameIndex++;
  }

  // Compute fatigue score for each reliever
  let today = new Date(endDateStr + "T12:00:00");
  let fatigueList = Object.entries(relievers).map(([pid, rp]) => {
    let totalPitches5 = rp.appearances.reduce((s,a)=>s+a.pitches, 0);
    let gamesBack = rp.appearances[0]?.gameIndex ?? 99; // how many games ago last appeared
    let lastPitches = rp.appearances[0]?.pitches || 0;
    let apps5 = rp.appearances.length;

    // Fatigue 0-4: higher = more tired
    let fatigue = 0;
    if (gamesBack === 0) { // pitched today/most recent
      if (lastPitches >= 25) fatigue = 4;
      else if (lastPitches >= 15) fatigue = 3;
      else fatigue = 2;
    } else if (gamesBack === 1) {
      if (lastPitches >= 30) fatigue = 3;
      else if (totalPitches5 > 70) fatigue = 2;
      else fatigue = 1;
    } else if (apps5 >= 4) {
      fatigue = totalPitches5 > 90 ? 2 : 1;
    }

    let fatLabel = ["FRESH","OK","USED","TIRED","LIMIT"][fatigue];
    let recentStr = rp.appearances.slice(0,3).map(a=>`${a.ip}ip/${a.pitches}p`).join(", ");

    // Identify likely role from pitch counts and appearance frequency
    let avgPitches = apps5 > 0 ? Math.round(totalPitches5/apps5) : 0;
    let role = avgPitches >= 80 ? "SP/Long" : avgPitches >= 25 ? "MR" : "SRP";
    // Heuristic for closer: highest # of appearances AND low er
    // (we can't know role for sure without more data, so label by usage)

    return {pid:+pid, ...rp, fatigue, fatLabel, recentStr, avgPitches, apps5, totalPitches5, gamesBack, role};
  });

  return fatigueList.sort((a,b) => {
    // Sort: relievers with most recent activity first, then by fatigue desc
    if (a.gamesBack !== b.gamesBack) return a.gamesBack - b.gamesBack;
    return b.fatigue - a.fatigue;
  });
}

// Relief pitcher history (original 3-game format)
async function getReliefHistory(endDateStr, teamName) {
  let history = [], games = await getPastGameList(endDateStr, teamName, 30);
  for (let game of games.slice(0,3)) {
    try {
      let box = await fetchJSON(`https://statsapi.mlb.com/api/v1/game/${game.pk}/boxscore`);
      let side = (game.awayName.toLowerCase().includes(teamName.toLowerCase())) ? "away" : "home";
      let teamBox = box.teams[side];
      let relievers = [];
      if (teamBox.pitchers) {
        for (let i = 1; i < teamBox.pitchers.length; i++) {
          let p = teamBox.players["ID"+teamBox.pitchers[i]];
          let s = p.stats.pitching;
          relievers.push([p.jerseyNumber||"-", p.person.fullName,
            s.inningsPitched+"ip ("+s.earnedRuns+"er)", s.numberOfPitches||0,
            p.person.pitchHand?.code||"?"]);
        }
      }
      history.push({summary: game.summary+" ("+game.date+")", relievers});
    } catch(e) {}
  }
  return history;
}

function handBadge(bats) {

  let cls = bats === "L" ? "flag-lefty" : bats === "R" ? "flag-righty" : "flag-warn";
  return `<span class="flag-badge ${cls}">${bats}</span>`;
}

    if (platoon.RvPR) parts.push(`vs R: ${platoon.RvPR}×`);
    if (platoon.RvPL) parts.push(`vs L: ${platoon.RvPL}×`);

    return `

        <div class="predict-label" style="margin-bottom:8px;">💡 BULLPEN PREDICTION NOTES — ${name}</div>
        ${freshList.length ? `<div style="font-size:12px;color:#7a9bbf;margin-bottom:5px;">🟢 Most likely available: ${freshList.join(', ')}</div>` : ''}
        ${tiredList.length ? `<div style="font-size:12px;color:#f44336;margin-bottom:5px;">🔴 High fatigue — unlikely unless emergency: ${tiredList.join(', ')}</div>` : ''}
        ${lefties.length ? `<div style="font-size:12px;color:#ce93d8;margin-bottom:5px;">🟣 LOOGY/lefty matchup candidates: ${lefties.join(', ')}</div>` : ''}
        ${righties.length && leftBatters.length ? `<div style="font-size:12px;color:#ffab91;margin-bottom:5px;">🟠 RHP matchup vs opp LHB (${leftBatters.slice(0,3).join(', ')}): ${righties.slice(0,3).join(', ')}</div>` : ''}
      </div>`;
  }

  return `
    <div class="section-title blue" style="margin-top:36px;">
      <span class="section-icon">🌡</span> BULLPEN FATIGUE TRACKER
    </div>
    <div class="bullpen-container">
      ${renderBullpenBlock(awayName, awayBullpen)}
      ${renderBullpenBlock(homeName, homeBullpen)}
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:24px;border:1px solid #1e3a5f;border-top:none;border-radius:0 0 12px 12px;overflow:hidden;">
      ${renderBullpenPrediction(awayName, awayBullpen, homeLineup)}
      ${renderBullpenPrediction(homeName, homeBullpen, awayLineup)}
    </div>`;
}

function renderLineupTable(awayName, homeName, awayLineup, homeLineup, awayBench, homeBench) {
  let html = `
    <div class="section-title green" style="margin-top:36px;">
      <span class="section-icon">📋</span> MATCHUP LINEUPS & BENCH
    </div>
    <div class="table-wrap">
    <table>
      <tr>
        <th colspan="6" style="background:#3d0010;color:#eee;text-align:center;">${awayName.toUpperCase()} — AWAY</th>
        <th colspan="5" style="background:#001a33;color:#eee;text-align:center;">${homeName.toUpperCase()} — HOME</th>
      </tr>
      <tr>
        <th>ORD</th><th>#</th><th>STARTER</th><th>POS</th><th>BACKUPS</th><th>B</th>
        <th>#</th><th>STARTER</th><th>POS</th><th>BACKUPS</th><th>B</th>
      </tr>`;

  for (let i = 0; i < 9; i++) {
    let a = awayLineup[i], h = homeLineup[i];
    html += `<tr>
      <td class="order-num">${i+1}</td>
      <td class="away-col" style="font-family:'DM Mono',monospace;color:#888;">${a.num}</td>
      <td class="away-col ${a.isOutOfPos?'out-of-pos':'player-name'}">${a.name}${a.isOutOfPos?` <span class="flag-badge flag-warn">OOP</span>`:''}</td>
      <td class="away-col"><span class="pos-badge">${a.pos}</span></td>
      <td class="away-col backup-pos">${a.backups}</td>
      <td class="away-col">${handBadge(a.bats)}</td>
      <td class="home-col" style="font-family:'DM Mono',monospace;color:#888;">${h.num}</td>
      <td class="home-col ${h.isOutOfPos?'out-of-pos':'player-name'}">${h.name}${h.isOutOfPos?` <span class="flag-badge flag-warn">OOP</span>`:''}</td>
      <td class="home-col"><span class="pos-badge">${h.pos}</span></td>
      <td class="home-col backup-pos">${h.backups}</td>
      <td class="home-col">${handBadge(h.bats)}</td>
    </tr>`;
  }

  html += `<tr class="game-sub-header"><td colspan="11" style="text-align:center;letter-spacing:3px;">— BENCH —</td></tr>`;
  let benchCount = Math.max(awayBench.length, homeBench.length);
  for (let b = 0; b < benchCount; b++) {
    let aB = awayBench[b]||{num:"",name:"",pos:"",backups:"",bats:""};
    let hB = homeBench[b]||{num:"",name:"",pos:"",backups:"",bats:""};
    html += `<tr>
      <td class="order-num">—</td>
      <td class="away-col" style="font-family:'DM Mono',monospace;color:#888;">${aB.num}</td>
      <td class="away-col player-name">${aB.name}</td>
      <td class="away-col"><span class="pos-badge">${aB.pos}</span></td>
      <td class="away-col backup-pos">${aB.backups}</td>
      <td class="away-col">${handBadge(aB.bats)}</td>
      <td class="home-col" style="font-family:'DM Mono',monospace;color:#888;">${hB.num}</td>
      <td class="home-col player-name">${hB.name}</td>
      <td class="home-col"><span class="pos-badge">${hB.pos}</span></td>
      <td class="home-col backup-pos">${hB.backups}</td>
      <td class="home-col">${handBadge(hB.bats)}</td>
    </tr>`;
  }
  html += `</table></div>`;
  return html;
}

function renderHistoryTables(awayName, homeName, awayHistory, homeHistory) {
  let html = `
    <div class="section-title dark" style="margin-top:36px;">
      <span class="section-icon">📅</span> 4-GAME POSITIONAL SUB HISTORY
    </div>
    <div class="table-wrap"><table>
      <tr>
        <th colspan="4" style="text-align:center;">${awayName.toUpperCase()}</th>
        <th colspan="4" style="text-align:center;">${homeName.toUpperCase()}</th>
      </tr>`;

  for (let i = 0; i < 4; i++) {
    let aG = awayHistory[i], hG = homeHistory[i];
    html += `<tr class="history-game-row">
      <td colspan="4" style="text-align:center;">${aG ? aG.summary+" ("+aG.date+")" : "No Data"}</td>
      <td colspan="4" style="text-align:center;">${hG ? hG.summary+" ("+hG.date+")" : "No Data"}</td>
    </tr>
    <tr style="font-size:11px;">
      <th>#</th><th>Player</th><th>Path</th><th>Detail</th>
      <th>#</th><th>Player</th><th>Path</th><th>Detail</th>
    </tr>`;
    let maxSubs = Math.max(aG?.subs?.length||0, hG?.subs?.length||0);
    if (maxSubs === 0) {
      html += `<tr><td colspan="8" style="text-align:center;color:#555;font-style:italic;">No substitutions recorded</td></tr>`;
    }
    for (let s = 0; s < maxSubs; s++) {
      let aS = (aG?.subs[s])||["","","",""];
      let hS = (hG?.subs[s])||["","","",""];
      html += `<tr>
        <td class="away-col" style="font-family:'DM Mono',monospace;color:#888;">${aS[0]}</td>
        <td class="away-col player-name">${aS[1]}</td>
        <td class="away-col" style="color:var(--gold);font-family:'DM Mono',monospace;">${aS[2]}</td>
        <td class="away-col" style="font-size:11px;color:#888;">${aS[3]}</td>
        <td class="home-col" style="font-family:'DM Mono',monospace;color:#888;">${hS[0]}</td>
        <td class="home-col player-name">${hS[1]}</td>
        <td class="home-col" style="color:var(--gold);font-family:'DM Mono',monospace;">${hS[2]}</td>
        <td class="home-col" style="font-size:11px;color:#888;">${hS[3]}</td>
      </tr>`;
    }
  }
  html += `</table></div>`;
  return html;
}

function renderReliefHistoryTable(awayName, homeName, awayRelief, homeRelief) {
  let html = `
    <div class="section-title red" style="margin-top:36px;">
      <span class="section-icon">⚡</span> 3-GAME RELIEF PITCHER LOG
    </div>
    <div class="table-wrap"><table>
      <tr>
        <th colspan="5" style="text-align:center;">${awayName.toUpperCase()} RELIEVERS</th>
        <th colspan="5" style="text-align:center;">${homeName.toUpperCase()} RELIEVERS</th>
      </tr>`;

  for (let i = 0; i < 3; i++) {
    let aRG = awayRelief[i], hRG = homeRelief[i];
    html += `<tr class="history-game-row">
      <td colspan="5" style="text-align:center;">${aRG ? aRG.summary : "No Data"}</td>
      <td colspan="5" style="text-align:center;">${hRG ? hRG.summary : "No Data"}</td>
    </tr>
    <tr style="font-size:11px;">
      <th>#</th><th>Reliever</th><th>IP (ER)</th><th>Pitches</th><th>Hand</th>
      <th>#</th><th>Reliever</th><th>IP (ER)</th><th>Pitches</th><th>Hand</th>
    </tr>`;
    let maxRP = Math.max(aRG?.relievers?.length||0, hRG?.relievers?.length||0);
    for (let r = 0; r < maxRP; r++) {
      let aP = (aRG?.relievers[r])||["","","","",""];
      let hP = (hRG?.relievers[r])||["","","","",""];
      html += `<tr>
        <td class="away-col" style="font-family:'DM Mono',monospace;color:#888;">${aP[0]}</td>
        <td class="away-col player-name">${aP[1]}</td>
        <td class="away-col" style="font-family:'DM Mono',monospace;">${aP[2]}</td>
        <td class="away-col" style="font-family:'DM Mono',monospace;">${aP[3]}</td>
        <td class="away-col">${aP[4]?`<span class="flag-badge ${aP[4]==='L'?'flag-lefty':'flag-righty'}">${aP[4]}HP</span>`:''}</td>
        <td class="home-col" style="font-family:'DM Mono',monospace;color:#888;">${hP[0]}</td>
        <td class="home-col player-name">${hP[1]}</td>
        <td class="home-col" style="font-family:'DM Mono',monospace;">${hP[2]}</td>
        <td class="home-col" style="font-family:'DM Mono',monospace;">${hP[3]}</td>
        <td class="home-col">${hP[4]?`<span class="flag-badge ${hP[4]==='L'?'flag-lefty':'flag-righty'}">${hP[4]}HP</span>`:''}</td>
      </tr>`;
    }
  }
  html += `</table></div>`;
  return html;
}

// 8. MAIN EXECUTOR

async function runMasterScout() {
  const searchDate = document.getElementById('dateInput').value;
  const teamInput  = document.getElementById('teamInput').value.trim();
  if (!searchDate||!teamInput) { alert("Please enter both a date and a team name."); return; }

  document.getElementById('loading').style.display = 'block';
  document.getElementById('runBtn').disabled = true;
  document.getElementById('reportContainer').innerHTML = '';

  try {
    setLoading("⚾ Looking up team...");
    const targetTeamId = await getTeamId(teamInput);
    if (!targetTeamId) throw new Error("Could not find team: " + teamInput);

    setLoading("📅 Fetching today's matchup schedule...");
    const scheduleData = await fetchJSON(`https://statsapi.mlb.com/api/v1/schedule?sportId=1&teamId=${targetTeamId}&date=${searchDate}`);
    if (!scheduleData.dates?.length) throw new Error("No game found for "+teamInput+" on "+searchDate);

    const game    = scheduleData.dates[0].games[0];
    const gamePk  = game.gamePk;
    const awayName = game.teams.away.team.name;
    const homeName = game.teams.home.team.name;

    setLoading("📋 Building lineup cards...");
    const boxData = await fetchJSON(`https://statsapi.mlb.com/api/v1/game/${gamePk}/boxscore`);

    const slots = [100,200,300,400,500,600,700,800,900];
    let awayLineup = [], homeLineup = [];
    for (let slot of slots) {
      awayLineup.push(await getPlayerInSlot(boxData.teams.away.players, slot));
      homeLineup.push(await getPlayerInSlot(boxData.teams.home.players, slot));
    }
    const [awayBench, homeBench] = await Promise.all([
      getBench(boxData.teams.away.players),
      getBench(boxData.teams.home.players)
    ]);

    setLoading("📊 Building substitution prediction models (20-game scan)...");
    const [awayPred, homePred] = await Promise.all([
      buildPredictionModel(searchDate, awayName),
      buildPredictionModel(searchDate, homeName)
    ]);

    setLoading("🌡 Analyzing bullpen fatigue (5-game window)...");
    const [awayBullpen, homeBullpen] = await Promise.all([
      buildBullpenFatigue(searchDate, awayName),
      buildBullpenFatigue(searchDate, homeName)
    ]);

    setLoading("📅 Loading 4-game sub & relief history...");
    const [awayHistory, homeHistory, awayRelief, homeRelief] = await Promise.all([
      getHistoryData(searchDate, awayName),
      getHistoryData(searchDate, homeName),
      getReliefHistory(searchDate, awayName),
      getReliefHistory(searchDate, homeName)
    ]);

    setLoading("🖊 Rendering report...");

    // Build matchup header
    let html = `
      <div class="matchup-header">
        <div class="matchup-team">
          <div class="matchup-team-name away-name">${awayName}</div>
          <div class="matchup-team-label">Away</div>
        </div>
        <div>
          <div class="matchup-vs">@</div>
          <div class="matchup-date">${searchDate}</div>
        </div>
        <div class="matchup-team">
          <div class="matchup-team-name home-name">${homeName}</div>
          <div class="matchup-team-label">Home</div>
        </div>
      </div>`;

    // Diagrams
    html += `
      <div class="diagram-container">
        <div class="diagram-card">
          <div class="diagram-header">
            <div class="diagram-team">${awayName}</div>
            <div class="diagram-date">${searchDate} · AWAY</div>
          </div>
          ${generateDiagramSVG(awayLineup)}
        </div>
        <div class="diagram-card">
          <div class="diagram-header">
            <div class="diagram-team">${homeName}</div>
            <div class="diagram-date">${searchDate} · HOME</div>
          </div>
          ${generateDiagramSVG(homeLineup)}
        </div>
      </div>`;

    html += renderPredictionPanel(awayName, homeName, awayPred, homePred, awayLineup, homeLineup);
    html += renderBullpenPanel(awayName, homeName, awayBullpen, homeBullpen, awayLineup, homeLineup);
    html += renderLineupTable(awayName, homeName, awayLineup, homeLineup, awayBench, homeBench);
    html += renderHistoryTables(awayName, homeName, awayHistory, homeHistory);
    html += renderReliefHistoryTable(awayName, homeName, awayRelief, homeRelief);

    // Footer
    html += `<div style="text-align:center;padding:40px;color:#333;font-size:12px;font-family:'DM Mono',monospace;">
      MLB MASTER SCOUT · DATA VIA MLB STATSAPI · GENERATED ${new Date().toLocaleString()}
    </div>`;

    document.getElementById('reportContainer').innerHTML = html;

  } catch(error) {
    document.getElementById('reportContainer').innerHTML = `
      <div style="padding:40px;text-align:center;color:#f44336;font-family:'DM Mono',monospace;">
        ⚠ Error: ${error.message}<br><br>
        <small style="color:#555;">Check team name spelling and that the date has a game. The MLB API may also be temporarily unavailable.</small>
      </div>`;
    console.error(error);
  } finally {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('runBtn').disabled = false;
  }
}

document.getElementById('dateInput').value =
  d.getFullYear() + '-' +
  String(d.getMonth()+1).padStart(2,'0') + '-' +
  String(d.getDate()).padStart(2,'0');
</script>
